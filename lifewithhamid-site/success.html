<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed — Life With Hamid</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><span class="mark">&#9654;</span>LIFE WITH <span class="accent">HAMID</span></a>
      <nav>
        <a href="/products.html">Products</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="status-box" id="status-box">
      <h2>Confirming your payment…</h2>
      <p class="muted">This only takes a second.</p>
    </div>
  </main>

  <footer>
    <div>&copy; 2026 Life With Hamid. All rights reserved.</div>
    <div>
      <a href="/privacy-policy.html">Privacy Policy</a>
      <a href="/refund-policy.html">Refund Policy</a>
      <a href="/terms-of-service.html">Terms of Service</a>
      <a href="/contact.html">Contact</a>
    </div>
  </footer>

  <script>
    async function verify() {
      const box = document.getElementById('status-box');
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        box.innerHTML = '<h2>Something\'s missing</h2><p class="muted">No order reference was found. If you just completed a purchase, please check your email or contact support.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/verify-session?session_id=${encodeURIComponent(sessionId)}`);
        const data = await res.json();

        if (data.paid && data.accessUrl) {
          box.innerHTML = `
            <h2>Thank you for your purchase!</h2>
            <p class="muted">${data.name || 'Your product'} is ready.</p>
            <p style="margin-top: 20px;"><a class="btn" href="${data.accessUrl}" target="_blank" rel="noopener">Access your download</a></p>
            <p class="muted" style="margin-top: 16px; font-size: 0.85rem;">We've also noted your order. If you lose this link, contact support with your order/session reference: ${sessionId}</p>
          `;
        } else if (data.paid === false) {
          box.innerHTML = '<h2>Payment not completed</h2><p class="muted">It looks like this order was not completed. If you were charged, please contact support.</p>';
        } else {
          box.innerHTML = `<h2>Could not verify this order</h2><p class="muted">Please contact support with reference: ${sessionId}</p>`;
        }
      } catch (err) {
        box.innerHTML = '<h2>Something went wrong</h2><p class="muted">Please contact support and mention this happened right after checkout.</p>';
      }
    }

    verify();
  </script>
</body>
</html>
